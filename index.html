<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>לוח הכפל של אמיליה</title>
<style>
  :root{
    --bg:#fdf7f2; --card:#ffffff; --ink:#33303c; --muted:#8a8496;
    --pink:#ff7aa8; --pink-d:#e85f8e; --mint:#2fbf9b; --sky:#5aa9f7;
    --sun:#ffc75a; --bad:#ef5f6b; --line:#efe7e0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100%;
  }
  .wrap{flex:1; display:flex; flex-direction:column; max-width:520px; margin:0 auto; width:100%; padding:14px 16px 20px}
  .top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px}
  .hello{font-size:17px; font-weight:700}
  .hello span{color:var(--pink-d)}
  .ghost{
    background:#fff; border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .stats{display:flex; gap:8px; margin:8px 0 4px}
  .chip{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:9px 6px; text-align:center;
  }
  .chip b{display:block; font-size:20px; line-height:1.2}
  .chip small{color:var(--muted); font-size:11px}
  .sync{text-align:center; color:var(--muted); font-size:11px; min-height:16px; margin:0 0 10px; font-weight:500}
  .qcard{
    background:var(--card); border:1px solid var(--line); border-radius:26px;
    padding:22px 16px; text-align:center; box-shadow:0 6px 18px rgba(80,60,70,.05);
  }
  .q{font-size:clamp(38px,13vw,58px); font-weight:800; letter-spacing:1px; direction:ltr}
  .ans{
    margin:14px auto 0; width:150px; height:62px; border-radius:18px;
    border:2px dashed var(--line); display:flex; align-items:center; justify-content:center;
    font-size:34px; font-weight:800; direction:ltr; background:#fffdfa;
  }
  .ans.filled{border-style:solid; border-color:var(--sky)}
  .ans.ok{border-color:var(--mint); background:#eefaf6; color:var(--mint)}
  .ans.no{border-color:var(--bad); background:#fdeef0; color:var(--bad)}
  .msg{min-height:26px; margin-top:10px; font-size:16px; font-weight:700}
  .msg.ok{color:var(--mint)} .msg.no{color:var(--bad)}
  .msg small{display:block; color:var(--muted); font-weight:600; font-size:13px; margin-top:2px}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:14px; direction:ltr}
  .key{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:16px 0; font-size:26px; font-weight:700; cursor:pointer; user-select:none;
  }
  .key:active{transform:translateY(1px); background:#f7f2ee}
  .key.wide{grid-column:span 1}
  .key.go{background:var(--mint); border-color:var(--mint); color:#fff; font-size:19px}
  .key.del{background:#fff2f5; border-color:#ffd9e3; color:var(--pink-d); font-size:22px}
  .send{
    margin-top:14px; width:100%; padding:14px; border-radius:18px; border:none;
    background:var(--pink); color:#fff; font-size:16px; font-weight:700; cursor:pointer;
  }
  .send:active{background:var(--pink-d)}
  .copy{margin-top:8px; width:100%; padding:11px; border-radius:16px; border:1px solid var(--line); background:#fff; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer}
  .hidden{display:none !important}
  h2{font-size:19px; margin:4px 0 12px}
  h3{font-size:15px; margin:18px 0 8px; color:var(--muted)}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{padding:7px 5px; text-align:right; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:600; font-size:12px}
  .grid{display:grid; grid-template-columns:repeat(11,1fr); gap:3px; direction:ltr; margin-top:6px}
  .cell{aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10px; background:#f4f0ec; color:var(--muted)}
  .cell.h{background:transparent; font-weight:700; color:var(--ink); font-size:11px}
  .cell.g{background:#d6f3ea; color:#127a63}
  .cell.m{background:#fff0cf; color:#8a6410}
  .cell.b{background:#fcd9dd; color:#a3262f}
  .hard{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px}
  .hard span{background:#fdeef0; color:#a3262f; border-radius:10px; padding:6px 10px; font-size:13px; font-weight:700; direction:ltr}
  .empty{color:var(--muted); font-size:14px; line-height:1.6; text-align:center; padding:12px 4px}
  .danger{margin-top:16px; width:100%; padding:12px; border-radius:16px; border:1px solid #ffd9e3; background:#fff; color:var(--bad); font-weight:700; font-size:14px; cursor:pointer}
  .pin{width:100%; padding:14px; font-size:22px; text-align:center; letter-spacing:8px; border-radius:16px; border:1px solid var(--line); direction:ltr}
  .note{color:var(--muted); font-size:12px; margin-top:8px; text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ PRACTICE ============ -->
  <div id="practice">
    <div class="top">
      <div class="hello">היי <span>אמיליה</span>! בואי נתרגל כפל</div>
      <button class="ghost" id="btnParent">הורים</button>
    </div>

    <div class="stats">
      <div class="chip"><b id="sCount">0</b><small>תרגילים</small></div>
      <div class="chip"><b id="sStreak">0</b><small>ברצף</small></div>
      <div class="chip"><b id="sAcc">—</b><small>הצלחה</small></div>
    </div>
    <div class="sync" id="syncStatus"></div>

    <div class="qcard">
      <div class="q" id="qText">— × — = ?</div>
      <div class="ans" id="ansBox">?</div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="pad" id="pad"></div>
    <button class="send" id="btnReport">שלחי דוח לאמא</button>
    <button class="copy" id="btnCopy">העתיקי את הדוח</button>
  </div>

  <!-- ============ PIN ============ -->
  <div id="pinScreen" class="hidden">
    <div class="top">
      <div class="hello">מסך הורים</div>
      <button class="ghost" id="btnPinBack">חזרה</button>
    </div>
    <div class="panel">
      <h2>הקלידו קוד</h2>
      <input class="pin" id="pinInput" type="tel" inputmode="numeric" maxlength="4" placeholder="••••">
      <div class="note" id="pinNote">ארבע ספרות</div>
    </div>
  </div>

  <!-- ============ PARENT ============ -->
  <div id="parent" class="hidden">
    <div class="top">
      <div class="hello">ההתקדמות של אמיליה</div>
      <button class="ghost" id="btnBack">חזרה לתרגול</button>
    </div>
    <div id="parentBody"></div>
    <button class="danger" id="btnReset">איפוס כל הנתונים</button>
  </div>

</div>
<script>
"use strict";
/* ---------------------------------------------------------------
   לוח הכפל של אמיליה — localStorage cache + Supabase cloud sync.

   ADAPTIVE WEIGHTING
   Every fact (a×b, 1..10) keeps: seen, correct, wrong, streak of
   consecutive corrects, and how many answers ago it was last missed.
   weight = 1 (baseline, so the whole table keeps circulating)
          + 6 * wrongRate            -> facts she misses are heavier
          + 5 if missed very recently (within last 12 answers)
          + 2 if never seen yet      -> pull unseen facts in early
          - decays toward 0.35 once streak >= 3 (mastered: rare, never gone)
   Next question = weighted random pick, never the same fact twice in a row.
----------------------------------------------------------------*/

var CLOUD = {
  url: "https://nrxhjzmmmzqjytmdgzjg.supabase.co",
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yeGhqem1tbXpxanl0bWRnempnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDg3MTAsImV4cCI6MjEwNDEyNDcxMH0.5KYX69e1AyXqtHHRejFarK-r1yoXdmlpav2Oazb2WIs",
  rowId: "emilia"
};

var MAX = 10, PIN = "2604", IDLE_MS = 3 * 60 * 1000, KEY = "kefel_amelia_v1";
var mem = null; // fallback if localStorage is blocked
var pushTimer = null;
var syncEl = null;

function cloudConfigured(){
  return CLOUD.url && CLOUD.url.indexOf("https://nrxhjzmmmzqjytmdgzjg.supabase.co") === -1;
}

function setSync(text){
  if(!syncEl) syncEl = document.getElementById("syncStatus");
  if(syncEl) syncEl.textContent = text || "";
}

function blank(){ return { facts:{}, sessions:[], answers:0 }; }
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : blank();
  }catch(e){ return mem || (mem = blank()); }
}
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ mem = db; }
}
function save(opts){
  opts = opts || {};
  saveLocal();
  if(opts.immediate){
    if(pushTimer){ clearTimeout(pushTimer); pushTimer = null; }
    cloudPush();
  }else{
    schedulePush();
  }
}
function schedulePush(){
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){
    pushTimer = null;
    cloudPush();
  }, 800);
}

function cloudHeaders(){
  return {
    "apikey": CLOUD.anonKey,
    "Authorization": "Bearer " + CLOUD.anonKey,
    "Content-Type": "application/json"
  };
}

function cloudPull(){
  if(!cloudConfigured()){
    setSync("");
    return Promise.resolve(false);
  }
  setSync("שומר בענן…");
  var url = CLOUD.url + "/rest/v1/kefel_state?id=eq." + encodeURIComponent(CLOUD.rowId) + "&select=data";
  return fetch(url, {
    method: "GET",
    headers: cloudHeaders()
  }).then(function(res){
    if(!res.ok) throw new Error("pull " + res.status);
    return res.json();
  }).then(function(rows){
    if(rows && rows.length && rows[0] && rows[0].data){
      var data = rows[0].data;
      if(typeof data === "string"){
        try{ data = JSON.parse(data); }catch(e){ data = null; }
      }
      if(data && typeof data === "object"){
        db = data;
        if(!db.facts) db.facts = {};
        if(!db.sessions) db.sessions = [];
        if(typeof db.answers !== "number") db.answers = 0;
        saveLocal();
        setSync("מסונכרן");
        return true;
      }
    }
    setSync("מסונכרן");
    return false;
  }).catch(function(){
    setSync("אין רשת — נשמר במכשיר");
    return false;
  });
}

function cloudPush(){
  if(!cloudConfigured()) return Promise.resolve(false);
  setSync("שומר בענן…");
  var url = CLOUD.url + "/rest/v1/kefel_state";
  var body = {
    id: CLOUD.rowId,
    data: db,
    updated_at: new Date().toISOString()
  };
  var headers = cloudHeaders();
  headers["Prefer"] = "resolution=merge-duplicates,return=minimal";
  return fetch(url, {
    method: "POST",
    headers: headers,
    body: JSON.stringify(body)
  }).then(function(res){
    if(!res.ok) throw new Error("push " + res.status);
    setSync("מסונכרן");
    return true;
  }).catch(function(){
    setSync("אין רשת — נשמר במכשיר");
    return false;
  });
}

var db = load();
if(!db.facts) db.facts = {};
if(!db.sessions) db.sessions = [];
if(typeof db.answers !== "number") db.answers = 0;

function fkey(a,b){ return (a<b? a+"x"+b : b+"x"+a); }
function fact(a,b){
  var k = fkey(a,b);
  if(!db.facts[k]) db.facts[k] = { seen:0, correct:0, wrong:0, streak:0, lastWrongAt:-9999 };
  return db.facts[k];
}
function parseKey(k){ var p = k.split("x"); return [parseInt(p[0],10), parseInt(p[1],10)]; }

/* ---------------- sessions ---------------- */
var session = null;
function currentSession(){
  var last = db.sessions[db.sessions.length-1];
  var now = Date.now();
  if(last && (now - last.last) < IDLE_MS){ session = last; return session; }
  session = { start: now, last: now, ms: 0, q: 0, correct: 0, best: 0 };
  db.sessions.push(session);
  save();
  return session;
}
function touchSession(){
  var now = Date.now(), s = currentSession();
  var dt = now - s.last;
  if(dt > 0 && dt < 60000) s.ms += dt;   // cap idle gaps so time stays honest
  s.last = now;
}

/* ---------------- question picking ---------------- */
function weightOf(a,b){
  var f = fact(a,b);
  if(f.seen === 0) return 3;
  var wrongRate = f.wrong / f.seen;
  var w = 1 + 6*wrongRate;
  if(db.answers - f.lastWrongAt <= 12) w += 5;
  if(f.streak >= 3) w = Math.max(0.35, w * 0.35);
  return w;
}
var cur = null, prevKey = "";
function nextQuestion(){
  var pool = [], total = 0, a, b, w;
  for(a=1; a<=MAX; a++){
    for(b=1; b<=MAX; b++){
      if(fkey(a,b) === prevKey) continue;
      w = weightOf(a,b);
      pool.push({a:a, b:b, w:w});
      total += w;
    }
  }
  var r = Math.random() * total, acc = 0, pick = pool[pool.length-1];
  for(var i=0; i<pool.length; i++){
    acc += pool[i].w;
    if(r <= acc){ pick = pool[i]; break; }
  }
  cur = { a: pick.a, b: pick.b };
  prevKey = fkey(cur.a, cur.b);
  typed = "";
  render();
}

/* ---------------- practice UI ---------------- */
var typed = "", locked = false;
var qText = document.getElementById("qText"), ansBox = document.getElementById("ansBox"),
    msg = document.getElementById("msg");

function render(){
  qText.textContent = cur.a + " × " + cur.b + " = ?";
  ansBox.textContent = typed === "" ? "?" : typed;
  ansBox.className = "ans" + (typed ? " filled" : "");
  msg.textContent = ""; msg.className = "msg";
  var s = currentSession();
  document.getElementById("sCount").textContent = s.q;
  document.getElementById("sStreak").textContent = streakNow;
  document.getElementById("sAcc").textContent = s.q ? Math.round(100*s.correct/s.q) + "%" : "—";
}
var streakNow = 0;

var PRAISE = ["מדויק!","נכון מאוד!","כל הכבוד!","יפה!","בדיוק!","אלופה!"];
function submit(){
  if(locked || typed === "") return;
  var val = parseInt(typed,10), f = fact(cur.a, cur.b), s = currentSession();
  touchSession();
  f.seen++; s.q++; db.answers++;
  if(val === cur.a * cur.b){
    f.correct++; f.streak++;
    s.correct++; streakNow++;
    if(streakNow > s.best) s.best = streakNow;
    ansBox.className = "ans ok";
    msg.className = "msg ok";
    msg.textContent = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    save({immediate:true});
    locked = true;
    setTimeout(function(){ locked = false; nextQuestion(); }, 700);
  }else{
    f.wrong++; f.streak = 0; f.lastWrongAt = db.answers;
    streakNow = 0;
    ansBox.className = "ans no";
    msg.className = "msg no";
    msg.innerHTML = "כמעט! " + cur.a + " × " + cur.b + " = " + (cur.a*cur.b) +
                    "<small>הקישי כדי להמשיך — נחזור לתרגיל הזה עוד מעט</small>";
    save({immediate:true});
    locked = true;
    var cont = function(){
      document.removeEventListener("click", cont);
      document.removeEventListener("keydown", contKey);
      locked = false; nextQuestion();
    };
    var contKey = function(e){ if(e.key === "Enter" || e.key === " ") cont(); };
    setTimeout(function(){
      document.addEventListener("click", cont);
      document.addEventListener("keydown", contKey);
    }, 250);
  }
  document.getElementById("sCount").textContent = s.q;
  document.getElementById("sStreak").textContent = streakNow;
  document.getElementById("sAcc").textContent = Math.round(100*s.correct/s.q) + "%";
}

var pad = document.getElementById("pad");
["1","2","3","4","5","6","7","8","9","מחק","0","בדקי"].forEach(function(lab){
  var b = document.createElement("button");
  b.className = "key" + (lab === "בדקי" ? " go" : "") + (lab === "מחק" ? " del" : "");
  b.textContent = lab;
  b.addEventListener("click", function(){
    if(locked) return;
    if(lab === "מחק"){ typed = typed.slice(0,-1); }
    else if(lab === "בדקי"){ submit(); return; }
    else if(typed.length < 3){ typed += lab; }
    ansBox.textContent = typed === "" ? "?" : typed;
    ansBox.className = "ans" + (typed ? " filled" : "");
  });
  pad.appendChild(b);
});
document.addEventListener("keydown", function(e){
  if(!document.getElementById("practice").classList.contains("hidden")){
    if(locked) return;
    if(/^[0-9]$/.test(e.key) && typed.length < 3){ typed += e.key; }
    else if(e.key === "Backspace"){ typed = typed.slice(0,-1); }
    else if(e.key === "Enter"){ submit(); return; }
    else return;
    ansBox.textContent = typed === "" ? "?" : typed;
    ansBox.className = "ans" + (typed ? " filled" : "");
  }
});

/* ---------------- helpers ---------------- */
function pad2(n){ return (n<10?"0":"") + n; }
function fmtDate(ts){ var d = new Date(ts); return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear(); }
function fmtTime(ts){ var d = new Date(ts); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function fmtDur(ms){
  var m = Math.round(ms/60000);
  if(m < 1) return "פחות מדקה";
  if(m < 60) return m + " דק׳";
  return Math.floor(m/60) + " שע׳ " + (m%60) + " דק׳";
}
function hardest(n){
  var arr = [];
  for(var k in db.facts){
    var f = db.facts[k];
    if(f.wrong > 0) arr.push({k:k, wrong:f.wrong, seen:f.seen, correct:f.correct});
  }
  arr.sort(function(x,y){
    if(y.wrong !== x.wrong) return y.wrong - x.wrong;
    return (x.correct/x.seen) - (y.correct/y.seen);
  });
  return arr.slice(0,n);
}

/* ---------------- WhatsApp report ---------------- */
function reportText(){
  var s = currentSession();
  if(!s.q) return null;
  var lines = [];
  lines.push("דוח תרגול לוח הכפל — אמיליה");
  lines.push(fmtDate(s.start) + " בשעה " + fmtTime(s.start));
  lines.push("זמן תרגול: " + fmtDur(s.ms));
  lines.push("תרגילים: " + s.q);
  lines.push("נכון: " + s.correct + " (" + Math.round(100*s.correct/s.q) + "%)");
  lines.push("הרצף הטוב ביותר: " + s.best);
  var hard = hardest(5);
  if(hard.length){
    lines.push("");
    lines.push("התרגילים הקשים:");
    hard.forEach(function(h){
      var p = parseKey(h.k);
      lines.push("• " + p[0] + "x" + p[1] + " — " + h.wrong + " טעויות");
    });
  }else{
    lines.push("");
    lines.push("בלי טעויות בכלל 🎉");
  }
  return lines.join("\n");
}
document.getElementById("btnReport").addEventListener("click", function(){
  var t = reportText();
  if(!t){
    msg.className = "msg no";
    msg.textContent = "קודם כמה תרגילים, ואז נשלח דוח";
    return;
  }
  window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank");
});
document.getElementById("btnCopy").addEventListener("click", function(){
  var t = reportText();
  if(!t){
    msg.className = "msg no";
    msg.textContent = "קודם כמה תרגילים, ואז נשלח דוח";
    return;
  }
  var done = function(){ msg.className = "msg ok"; msg.textContent = "הדוח הועתק — אפשר להדביק בוואטסאפ"; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, function(){ window.prompt("העתיקי את הדוח:", t); });
  }else{ window.prompt("העתיקי את הדוח:", t); }
});

/* ---------------- parent view ---------------- */
var scr = { practice: document.getElementById("practice"), pin: document.getElementById("pinScreen"), parent: document.getElementById("parent") };
function show(name){
  for(var k in scr) scr[k].classList.add("hidden");
  scr[name].classList.remove("hidden");
}
document.getElementById("btnParent").addEventListener("click", function(){
  document.getElementById("pinInput").value = "";
  document.getElementById("pinNote").textContent = "ארבע ספרות";
  show("pin");
  setTimeout(function(){ document.getElementById("pinInput").focus(); }, 60);
});
document.getElementById("btnPinBack").addEventListener("click", function(){ show("practice"); });
document.getElementById("pinInput").addEventListener("input", function(e){
  var v = e.target.value.replace(/\D/g,"").slice(0,4);
  e.target.value = v;
  if(v.length === 4){
    if(v === PIN){
      cloudPull().then(function(){
        buildParent();
        show("parent");
        save({immediate:true});
      });
    }
    else{ document.getElementById("pinNote").textContent = "קוד לא נכון"; e.target.value = ""; }
  }
});
document.getElementById("btnBack").addEventListener("click", function(){ show("practice"); nextQuestion(); });
document.getElementById("btnReset").addEventListener("click", function(){
  if(window.confirm("לאפס את כל נתוני התרגול של אמיליה? אין דרך לשחזר.")){
    db = blank(); session = null; streakNow = 0;
    save({immediate:true});
    buildParent();
  }
});

function buildParent(){
  var host = document.getElementById("parentBody");
  var real = db.sessions.filter(function(s){ return s.q > 0; });
  if(!real.length){
    host.innerHTML = '<div class="panel"><div class="empty">עדיין אין נתונים משותפים בענן.<br>אחרי שאמיליה תתרגל בכל מכשיר (הטלפון שלה או של אמא), יופיעו כאן הישיבות, הזמנים והתרגילים שהיא מתקשה בהם.</div></div>';
    return;
  }
  var tq = 0, tc = 0, tms = 0;
  real.forEach(function(s){ tq += s.q; tc += s.correct; tms += s.ms; });

  var h = '<div class="panel">';
  h += '<h2>סך הכול</h2><table>';
  h += '<tr><th>ישיבות תרגול</th><td>' + real.length + '</td></tr>';
  h += '<tr><th>תרגילים</th><td>' + tq + '</td></tr>';
  h += '<tr><th>אחוז הצלחה</th><td>' + Math.round(100*tc/tq) + '%</td></tr>';
  h += '<tr><th>זמן תרגול מצטבר</th><td>' + fmtDur(tms) + '</td></tr>';
  h += '</table></div>';

  h += '<h3>ישיבות תרגול</h3><div class="panel"><table>';
  h += '<tr><th>תאריך</th><th>שעה</th><th>זמן</th><th>תרגילים</th><th>הצלחה</th></tr>';
  real.slice().reverse().slice(0,25).forEach(function(s){
    h += '<tr><td>' + fmtDate(s.start) + '</td><td>' + fmtTime(s.start) + '</td><td>' + fmtDur(s.ms) +
         '</td><td>' + s.correct + '/' + s.q + '</td><td>' + Math.round(100*s.correct/s.q) + '%</td></tr>';
  });
  h += '</table></div>';

  var hard = hardest(8);
  h += '<h3>התרגילים הקשים ביותר</h3><div class="panel">';
  if(hard.length){
    h += '<div class="hard">';
    hard.forEach(function(x){
      var p = parseKey(x.k);
      h += '<span>' + p[0] + '×' + p[1] + ' · ' + x.wrong + ' טעויות</span>';
    });
    h += '</div>';
  }else{
    h += '<div class="empty">אין תרגילים עם טעויות — הכול נכון עד כה.</div>';
  }
  h += '</div>';

  h += '<h3>מפת לוח הכפל</h3><div class="panel"><div class="grid">';
  h += '<div class="cell h">×</div>';
  for(var c=1; c<=MAX; c++) h += '<div class="cell h">' + c + '</div>';
  for(var r=1; r<=MAX; r++){
    h += '<div class="cell h">' + r + '</div>';
    for(var c2=1; c2<=MAX; c2++){
      var f = db.facts[fkey(r,c2)];
      if(!f || !f.seen){ h += '<div class="cell">·</div>'; continue; }
      var acc = f.correct / f.seen, cls = acc >= 0.85 ? "g" : (acc >= 0.6 ? "m" : "b");
      h += '<div class="cell ' + cls + '">' + Math.round(acc*100) + '</div>';
    }
  }
  h += '</div><div class="note">ירוק — שולטת, כתום — עוד לא יציב, אדום — צריך תרגול. נקודה — עוד לא נשאלה.</div></div>';

  host.innerHTML = h;
}

/* ---------------- go ---------------- */
syncEl = document.getElementById("syncStatus");
cloudPull().then(function(){
  currentSession();
  nextQuestion();
});
</script>
